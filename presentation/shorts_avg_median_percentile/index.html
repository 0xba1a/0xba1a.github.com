<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Average vs Percentile</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="stage">

    <!-- Scene 1: Hook -->
    <div class="scene scene-hook">
      <div class="hook-title"><span class="hook-avg">Average<span class="hook-strikethrough"></span></span> Response Time?</div>
      <div class="hook-subtitle">It's a trap.</div>
    </div>

    <!-- Scene 2–7: Chart area -->
    <div class="scene scene-chart">
      <div class="chart-title" id="chartTitle">Response Times per Request</div>
      <div class="chart-container" id="chartContainer"></div>
    </div>

    <!-- Scene 8: Comparison -->
    <div class="scene scene-compare">
      <div class="compare-card">
        <div class="compare-row bad">
          <span class="compare-icon">✗</span>
          <span class="compare-label">Average:</span>
          <span class="compare-value" id="cmpAvg">830ms</span>
          <span class="compare-note">— hides outliers</span>
        </div>
        <div class="compare-row good">
          <span class="compare-icon">✓</span>
          <span class="compare-label">p50:</span>
          <span class="compare-value" id="cmpP50">52ms</span>
          <span class="compare-note">— typical user</span>
        </div>
        <div class="compare-row good">
          <span class="compare-icon">✓</span>
          <span class="compare-label">p99:</span>
          <span class="compare-value" id="cmpP99">140ms</span>
          <span class="compare-note">— worst case</span>
        </div>
      </div>
    </div>

    <!-- Scene 9: Takeaway -->
    <div class="scene scene-takeaway">
      <div class="takeaway-card">
        <div class="takeaway-line strike">Don't use Average.</div>
        <div class="takeaway-line highlight">Use p50, p99, p99.9</div>
        <div class="takeaway-slo">SLO = "p99 &lt; 200ms"</div>
      </div>
      <div class="takeaway-cta">Follow for more system design fundamentals</div>
    </div>

    <!-- Bottom HUD -->
    <div class="hud">
        <div id="stepCounter">0 / 8</div>
      <div id="clickHint">Tap or press → to advance</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
