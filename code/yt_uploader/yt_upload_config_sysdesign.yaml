# YouTube Shorts Upload Configuration — System Design Interview series
# --------------------------------------------------------------------

# Path to your OAuth 2.0 client secrets file (from Google Cloud Console)
client_secrets_file: "../shorts_agent/client_secrets.json"

# Target channel. The uploader aborts if the authenticated YouTube channel's
# title does not match this (case-insensitive) — prevents uploading to the
# wrong channel when one Google account owns several channels.
channel_name: "Command Line"

# No playlist for these videos. Leave empty -> videos are NOT added to any
# playlist, and the schedule is computed from the channel's own uploads.
playlist_id: ""

# YouTube video category ID (27 = Education)
category_id: "27"

# Language for video metadata, narration audio, and the Short itself (English)
default_language: "en"
default_audio_language: "en"

# Whether the video is made for kids (COPPA compliance)
made_for_kids: false

# Whether the video is embeddable on other sites
embeddable: true

# Video license: "youtube" (standard) or "creativeCommon"
license: "youtube"

# Scheduling: one video per day, at the next free day, 08:15 local time.
# The next free day is the day after the latest already-scheduled upload on the
# channel (or tomorrow if nothing is scheduled yet).
schedule_hour: 8
schedule_minute: 15

# Uploaded as private + publishAt so YouTube auto-publishes at the scheduled time
privacy_status: "private"

# Tags (keywords) attached to every uploaded video
tags:
  - "system design"
  - "system design interview"
  - "system design interview questions"
  - "database internals"
  - "lsm tree"
