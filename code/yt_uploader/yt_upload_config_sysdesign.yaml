# Per-video metadata. Videos are uploaded in this order, one per day.
# `file` paths are resolved relative to this config file's directory.
# NOTE: parts 1-3 already uploaded (06-15/16/17) and their final.mp4 files were
# moved to per-folder ARCHIVE/. The uploader hard-exits on a missing file, so
# only the not-yet-uploaded video stays in this manifest.
videos:
  - file: "../shorts_agent/shorts/lsm-tree/lsm-tree-tombstones-bloom-filters/final.mp4"
    title: "How LSM Trees Delete Data | Tombstones + Bloom Filters"
    publish_at: "2026-06-18 08:15"
    description: |
      How do you delete a key when the files on disk can never be changed? You
      don't erase it — you write a tombstone, a marker that says the key is gone.
      Reads honor it because the newest write always wins, and compaction later
      drops the key for good. Then bloom filters make reads fast: a tiny in-memory
      filter per segment that can say a key is definitely not here, so you skip
      pointless disk reads. Together they complete the LSM-tree — the engine behind
      LevelDB, RocksDB, and Cassandra.

      Part 4 of the LSM-Tree series (based on Designing Data-Intensive Applications,
      Chapter 4). Essential for backend and system design interview prep.
